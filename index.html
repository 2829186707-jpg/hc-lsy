            <div class="modal-header"><h3>馃摛 鍒嗕韩鍗＄墖</h3><button class="modal-close" data-close="shareModal">鉁?/button></div>
            <div class="modal-body" style="text-align:center;">
                <canvas id="shareCanvas" style="max-width:100%;border-radius:16px;box-shadow:var(--shadow-lg);"></canvas>
                <div style="margin-top:16px;"><button class="primary-btn" id="shareDownloadBtn">涓嬭浇鍗＄墖</button></div>
            </div>
        </div>
    </div>

    <!-- 鐏 -->
    <div class="modal lightbox" id="lightboxModal">
        <div class="lightbox-content">
            <button class="lightbox-close" data-close="lightboxModal">鉁?/button>
            <button class="lightbox-nav lightbox-prev" id="lightboxPrev">鈥?/button>
            <div class="lightbox-media" id="lightboxMedia"></div>
            <button class="lightbox-nav lightbox-next" id="lightboxNext">鈥?/button>
            <div class="lightbox-caption" id="lightboxCaption"></div>
            <div class="lightbox-slideshow-bar" id="lightboxSlideshowBar" style="display:none;position:absolute;bottom:-34px;left:50%;transform:translateX(-50%);display:none;gap:10px;align-items:center;background:rgba(0,0,0,0.6);padding:6px 14px;border-radius:20px;">
                <button id="slideshowPlayPause" style="background:none;border:none;color:white;font-size:16px;cursor:pointer;padding:0 4px;">鈴?/button>
                <span style="color:white;font-size:11px;opacity:0.8;">闂撮殧</span>
                <select id="slideshowSpeed" style="background:rgba(255,255,255,0.15);color:white;border:1px solid rgba(255,255,255,0.3);border-radius:10px;padding:2px 6px;font-size:11px;outline:none;">
                    <option value="2000">2绉?/option>
                    <option value="3000" selected>3绉?/option>
                    <option value="5000">5绉?/option>
                    <option value="8000">8绉?/option>
                </select>
                <span id="slideshowCounter" style="color:white;font-size:11px;opacity:0.8;">1/1</span>
            </div>
            <div style="position:absolute;bottom:-64px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;">
                <select id="lightboxAlbum" style="min-width:110px;background:rgba(0,0,0,0.5);color:white;border:1px solid rgba(255,255,255,0.4);border-radius:14px;padding:5px 24px 5px 10px;font-size:11px;outline:none;-webkit-appearance:none;appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2210%22 height=%2210%22 viewBox=%220 0 10 10%22><path fill=%22white%22 d=%22M0 3l5 5 5-5z%22/></svg>');background-repeat:no-repeat;background-position:right 8px center;">
                    <option value="">绉诲姩鍒扮浉鍐?..</option>
                </select>
                <input type="date" id="lightboxDate" style="background:rgba(0,0,0,0.5);color:white;border:1px solid rgba(255,255,255,0.4);border-radius:14px;padding:5px 10px;font-size:11px;outline:none;color-scheme:dark;">
            </div>
            <button class="lightbox-delete" id="lightboxDelete">鍒犻櫎</button>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="js/app.js?v=46"></script>
</body>
</html>
